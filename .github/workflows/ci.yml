name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore MatterHarbor.sln --locked-mode
      - run: dotnet tool restore
      - run: dotnet format MatterHarbor.sln --verify-no-changes --no-restore
      - run: dotnet build MatterHarbor.sln --configuration Release --no-restore
      - run: dotnet test MatterHarbor.sln --configuration Release --no-build --filter "Category!=EndToEnd" --logger trx
      - run: dotnet list MatterHarbor.sln package --vulnerable --include-transitive

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/MatterHarbor.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: src/MatterHarbor.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high

  containers-and-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file src/MatterHarbor.Api/Dockerfile --tag matterharbor-api:ci .
      - run: docker build --file src/MatterHarbor.Worker/Dockerfile --tag matterharbor-worker:ci .
      - run: docker build --file src/MatterHarbor.Web/Dockerfile --tag matterharbor-web:ci .
      - name: Validate Bicep syntax
        run: az bicep build --file infra/bicep/main.bicep

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore tests/MatterHarbor.EndToEndTests/MatterHarbor.EndToEndTests.csproj --locked-mode
      - run: dotnet build tests/MatterHarbor.EndToEndTests/MatterHarbor.EndToEndTests.csproj --configuration Release --no-restore
      - run: pwsh tests/MatterHarbor.EndToEndTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: docker compose --file compose.e2e.yaml up --build --detach --wait
      - run: curl --fail --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:5080/health/ready
      - run: curl --fail --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:5173/
      - run: dotnet test tests/MatterHarbor.EndToEndTests/MatterHarbor.EndToEndTests.csproj --configuration Release --no-build --logger trx
        env:
          MATTERHARBOR_E2E_BASE_URL: http://127.0.0.1:5173
          MATTERHARBOR_E2E_CONNECTION_STRING: Host=127.0.0.1;Port=5433;Database=matterharbor;Username=matterharbor;Password=matterharbor_e2e
      - if: always()
        run: docker compose --file compose.e2e.yaml logs
      - if: always()
        run: docker compose --file compose.e2e.yaml down --volumes
