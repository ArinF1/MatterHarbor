name: matterharbor

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matterharbor
      POSTGRES_USER: matterharbor
      POSTGRES_PASSWORD: matterharbor_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matterharbor -d matterharbor"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - matterharbor-postgres:/var/lib/postgresql/data

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  matterharbor-postgres:
