name: matterharbor-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matterharbor
      POSTGRES_USER: matterharbor
      POSTGRES_PASSWORD: matterharbor_e2e
    ports:
      - "${MATTERHARBOR_E2E_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matterharbor -d matterharbor"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: src/MatterHarbor.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MatterHarbor: Host=postgres;Port=5432;Database=matterharbor;Username=matterharbor;Password=matterharbor_e2e
      Cors__AllowedOrigins__0: ${MATTERHARBOR_E2E_WEB_ORIGIN:-http://127.0.0.1:5173}
      OpenTelemetry__OtlpEndpoint: ""
    ports:
      - "${MATTERHARBOR_E2E_API_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/MatterHarbor.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__MatterHarbor: Host=postgres;Port=5432;Database=matterharbor;Username=matterharbor;Password=matterharbor_e2e
      OpenTelemetry__OtlpEndpoint: ""
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: src/MatterHarbor.Web/Dockerfile
      args:
        VITE_API_BASE_URL: ${MATTERHARBOR_E2E_API_BASE_URL:-http://127.0.0.1:5080}
    ports:
      - "${MATTERHARBOR_E2E_WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_started
